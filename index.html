<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oran Labs — Legal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d0d0d; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 40px 20px; }
    .logo { font-size: 32px; font-weight: 900; color: #F5A623; letter-spacing: -1px; margin-bottom: 8px; }
    .sub { color: #888; font-size: 14px; margin-bottom: 48px; }
    .cards { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .card { background: #161616; border: 1px solid #2a2a2a; border-radius: 20px; padding: 32px 40px; text-decoration: none; color: #f0f0f0; transition: border-color 0.2s; min-width: 200px; }
    .card:hover { border-color: #F5A623; }
    .card-icon { font-size: 36px; margin-bottom: 12px; }
    .card-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .card-sub { font-size: 12px; color: #888; }
    footer { margin-top: 48px; color: #555; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Oran Labs</div>
    <div class="sub">Legal Documents · Fitvolve</div>
    <div class="cards">
      <a href="/privacy" class="card">
        <div class="card-icon">🔒</div>
        <div class="card-title">Privacy Policy</div>
        <div class="card-sub">Gizlilik Politikası</div>
      </a>
      <a href="/terms" class="card">
        <div class="card-icon">📋</div>
        <div class="card-title">Terms of Use</div>
        <div class="card-sub">Kullanım Şartları</div>
      </a>
    </div>
    <footer>© 2025 Oran Labs · oranlabs.dev@gmail.com</footer>
  </div>
</body>
</html>
